name: repository-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe unprivileged sandbox capability
        id: sandbox
        run: node scripts/check-sandbox.mjs
      - name: Test control plane and hostile fixtures
        run: npm test
      - name: Validate command entry points
        run: npm run check
      - name: Build official DSH Bridge release candidate
        env:
          HARMAN_NPM_CACHE: ${{ runner.temp }}/harman-npm-cache
        run: |
          mkdir -p dist/dsh-bridge
          npm run build:bridge -- --package-version 1.0.0-pre-2 --dsh-version latest --output dist/dsh-bridge
      - name: Build reviewed recipes twice with provenance and SBOM
        if: steps.sandbox.outputs.isolated == 'true'
        run: |
          mkdir -p dist/recipes
          find recipes -type f -name '*.json' -print0 | while IFS= read -r -d '' recipe; do
            name="$(basename "${recipe%.json}")"
            node apps/cli/harman-repo.js build "$recipe" "dist/recipes/$name"
          done
      - name: Record sandbox deferral
        if: steps.sandbox.outputs.isolated != 'true'
        run: echo "::notice::bubblewrap recipe/profile integration is deferred to the codex-test privileged-capability validation; Hosted CI remains unprivileged."
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-repository-artifacts
          path: dist/recipes
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-bridge-release-candidate
          path: dist/dsh-bridge
